# Structural and privacy checks for the skills. This repository is public and holds no data,
# so the check that matters most is that no private path has crept in.
name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - name: Install yaml
        run: Rscript -e 'install.packages("yaml")'

      - name: Validate
        run: Rscript config/validate-skills.R
