# Structural and privacy checks for the skills. This repository is public and holds no data,
# so the check that matters most is that no private path has crept in.
name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - name: Install yaml
        run: Rscript -e 'install.packages("yaml")'

      - name: Validate
        run: Rscript config/validate-skills.R
